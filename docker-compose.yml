services:
  api:
    build: ./app
    image: reservas-api
    container_name: reservas-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reservas-net

  postgres:
    image: postgres:15-alpine
    container_name: reservas-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - reservas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reservas-net

networks:
  reservas-net:
    driver: bridge

volumes:
  reservas-db-data:
